{% extends "base.html" %} {% block title %}로그 뷰어 - 이메일 타임라인 시스템{%
endblock %} {% block extra_css %} {% endblock %} {% block content %}
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2><i class="fas fa-file-alt text-primary"></i> 로그 뷰어</h2>
      <p class="text-muted mb-0">
        <small>실시간 애플리케이션 로그 모니터링</small>
      </p>
    </div>
  </div>

  <!-- 통계 -->
  <div class="row mb-4">
    <div class="col-md-3">
      <div
        class="card text-white bg-info card-selectable-sm filter-btn"
        data-card-type="log-level"
        data-filter-type="log-level"
        data-level="DEBUG"
        onclick="filterByLevel('DEBUG')"
      >
        <div class="card-body text-center">
          <h5 class="card-title"><i class="fas fa-bug"></i> DEBUG</h5>
          <h2 id="debugCount">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div
        class="card text-white bg-primary card-selectable-sm filter-btn"
        data-card-type="log-level"
        data-filter-type="log-level"
        data-level="INFO"
        onclick="filterByLevel('INFO')"
      >
        <div class="card-body text-center">
          <h5 class="card-title"><i class="fas fa-info-circle"></i> INFO</h5>
          <h2 id="infoCount">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div
        class="card text-white bg-warning card-selectable-sm filter-btn"
        data-card-type="log-level"
        data-filter-type="log-level"
        data-level="WARNING"
        onclick="filterByLevel('WARNING')"
      >
        <div class="card-body text-center">
          <h5 class="card-title">
            <i class="fas fa-exclamation-triangle"></i> WARNING
          </h5>
          <h2 id="warningCount">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div
        class="card text-white bg-danger card-selectable-sm filter-btn"
        data-card-type="log-level"
        data-filter-type="log-level"
        data-level="ERROR"
        onclick="filterByLevel('ERROR')"
      >
        <div class="card-body text-center">
          <h5 class="card-title"><i class="fas fa-times-circle"></i> ERROR</h5>
          <h2 id="errorCount">0</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- 컨트롤 -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-md-2">
          <label for="levelFilter" class="form-label small mb-1">레벨</label>
          <select id="levelFilter" class="form-select" onchange="loadLogs()">
            <option value="">전체</option>
            <option value="DEBUG">DEBUG</option>
            <option value="INFO">INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
            <option value="CRITICAL">CRITICAL</option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="limitInput" class="form-label small mb-1"
            >표시 개수</label
          >
          <input
            type="number"
            id="limitInput"
            class="form-control"
            value="100"
            min="10"
            max="1000"
            step="10"
            onchange="loadLogs()"
          />
        </div>
        <div class="col-md-2">
          <label class="form-label small mb-1">자동 갱신</label>
          <div class="form-check pt-0375rem">
            <input
              type="checkbox"
              id="autoRefresh"
              class="form-check-input"
              onchange="toggleAutoRefresh()"
            />
            <label for="autoRefresh" class="form-check-label">5초마다</label>
          </div>
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100" onclick="loadLogs()">
            <i class="fas fa-sync-alt"></i> 새로고침
          </button>
        </div>
        <div class="col-md-2">
          <button class="btn btn-warning w-100" onclick="clearLogs()">
            <i class="fas fa-trash"></i> 초기화
          </button>
        </div>
        <div class="col-md-2">
          <button class="btn btn-success w-100" onclick="downloadLogs()">
            <i class="fas fa-download"></i> 다운로드
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 로그 엔트리 -->
  <div class="log-container">
    <div class="log-entries" id="logEntries">
      <div class="no-logs">
        <i class="fas fa-spinner fa-spin"></i>
        <p>로그 불러오는 중...</p>
      </div>
    </div>
  </div>

  <!-- 로그 파일 목록 -->
  <div class="log-files-section">
    <h2><i class="fas fa-folder-open me-2"></i>저장된 로그 파일</h2>
    <div class="log-files-list" id="logFilesList">
      <!-- 동적 로드 -->
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  let autoRefreshInterval = null;
  let selectedLevelCard = null;

  function filterByLevel(level) {
    const levelFilter = document.getElementById("levelFilter");

    // 모든 레벨 카드에서 선택 상태 제거
    document
      .querySelectorAll('[data-card-type="log-level"]')
      .forEach((card) => {
        card.classList.remove("card-selected");
        card.classList.remove("filter-btn-active");
      });

    if (levelFilter.value === level) {
      // 같은 레벨 재클릭 시 필터 해제
      levelFilter.value = "";
      selectedLevelCard = null;
    } else {
      // 새로운 레벨 선택
      levelFilter.value = level;

      // 클릭된 카드 선택 상태 추가
      const clickedCard = document.querySelector(`[data-level="${level}"]`);
      if (clickedCard) {
        clickedCard.classList.add("card-selected");
        clickedCard.classList.add("filter-btn-active");
        selectedLevelCard = clickedCard;
      }
    }
    loadLogs();
  }

  function loadLogs() {
    const level = document.getElementById("levelFilter").value;
    const limit = document.getElementById("limitInput").value;

    const params = new URLSearchParams();
    if (level) params.append("level", level);
    if (limit) params.append("limit", limit);

    fetch(`/api/logs?${params.toString()}`)
      .then((response) => response.json())
      .then((data) => {
        displayLogs(data.logs);
        updateStats(data.stats);
      })
      .catch((error) => {
        console.error("로그 로드 실패:", error);
        document.getElementById("logEntries").innerHTML = `
          <div class="no-logs">
            <i class="fas fa-exclamation-triangle"></i>
            <p>로그 로드 실패: ${error.message}</p>
          </div>
        `;
      });
  }

  function displayLogs(logs) {
    const container = document.getElementById("logEntries");

    if (!logs || logs.length === 0) {
      container.innerHTML = `
        <div class="no-logs">
          <i class="fas fa-inbox"></i>
          <p>표시할 로그가 없습니다</p>
        </div>
      `;
      return;
    }

    container.innerHTML = logs
      .map(
        (log) => `
      <div class="log-entry">
        <div class="log-timestamp">${formatDateTime(log.timestamp)}</div>
        <div class="log-level ${log.level}">${log.level}</div>
        <div>
          <div class="log-message">${escapeHtml(log.message)}</div>
          <div class="log-details">${log.module}.${log.funcName}:${
          log.lineno
        }</div>
        </div>
      </div>
    `
      )
      .join("");
  }

  function updateStats(stats) {
    document.getElementById("debugCount").textContent = stats.DEBUG || 0;
    document.getElementById("infoCount").textContent = stats.INFO || 0;
    document.getElementById("warningCount").textContent = stats.WARNING || 0;
    document.getElementById("errorCount").textContent =
      (stats.ERROR || 0) + (stats.CRITICAL || 0);
  }

  function clearLogs() {
    if (
      !confirm(
        "메모리의 모든 로그를 초기화하시겠습니까?\n(파일에 저장된 로그는 유지됩니다)"
      )
    ) {
      return;
    }

    fetch("/api/logs/clear", { method: "POST" })
      .then((response) => response.json())
      .then((data) => {
        alert(data.message);
        loadLogs();
      })
      .catch((error) => {
        console.error("로그 초기화 실패:", error);
        alert("로그 초기화 실패: " + error.message);
      });
  }

  function downloadLogs() {
    const level = document.getElementById("levelFilter").value;
    const limit = document.getElementById("limitInput").value;

    const params = new URLSearchParams();
    if (level) params.append("level", level);
    if (limit) params.append("limit", limit);

    window.location.href = `/api/logs/download?${params.toString()}`;
  }

  function toggleAutoRefresh() {
    const autoRefresh = document.getElementById("autoRefresh").checked;

    if (autoRefresh) {
      autoRefreshInterval = setInterval(loadLogs, 5000);
    } else {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }
    }
  }

  function loadLogFiles() {
    fetch("/api/logs/files")
      .then((response) => response.json())
      .then((data) => {
        displayLogFiles(data.files);
      })
      .catch((error) => {
        console.error("로그 파일 목록 로드 실패:", error);
      });
  }

  function displayLogFiles(files) {
    const container = document.getElementById("logFilesList");

    if (!files || files.length === 0) {
      container.innerHTML = `<p style="text-align: center; color: var(--text-secondary);">저장된 로그 파일이 없습니다</p>`;
      return;
    }

    container.innerHTML = files
      .map(
        (file) => `
      <div class="log-file-item">
        <div class="log-file-info">
          <i class="fas fa-file-alt log-file-icon"></i>
          <div class="log-file-details">
            <h4>${file.name}</h4>
            <p>${file.size_mb} MB • ${formatDateTimeFull(file.modified)}</p>
          </div>
        </div>
        <div class="log-file-actions">
          <button class="btn-view" onclick="viewLogFile('${file.name}')">
            <i class="fas fa-eye"></i> 보기
          </button>
          <button class="btn-download-file" onclick="downloadLogFile('${
            file.name
          }')">
            <i class="fas fa-download"></i>
          </button>
        </div>
      </div>
    `
      )
      .join("");
  }

  function viewLogFile(filename) {
    window.open(`/api/logs/file/${filename}`, "_blank");
  }

  function downloadLogFile(filename) {
    window.location.href = `/api/logs/file/${filename}/download`;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // 초기 로드
  document.addEventListener("DOMContentLoaded", () => {
    loadLogs();
    loadLogFiles();
    // 자동 갱신은 기본적으로 꺼져있음 (체크박스 unchecked)
  });
</script>
{% endblock %}
