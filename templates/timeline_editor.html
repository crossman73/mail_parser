{% extends "base.html" %}
{% block title %}타임라인 편집기 - 이메일 타임라인 시스템{% endblock %}

{% block extra_css %}
<style>
/* ── 타임라인 편집기 스타일 ── */
.tl-toolbar { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
.tl-list-item { cursor:pointer; transition:background .15s; }
.tl-list-item:hover { background:var(--bs-light,#f8f9fa); }
.tl-list-item.active { border-left:3px solid var(--bs-primary); }

.event-card { border:1px solid var(--bs-border-color,#dee2e6); border-radius:.5rem;
  padding:1rem; margin-bottom:.5rem; background:var(--card-bg, var(--bs-body-bg));
  transition:box-shadow .15s, transform .15s; cursor:grab; }
.event-card:active { cursor:grabbing; }
.event-card.sortable-ghost { opacity:.4; background:var(--bs-primary-bg-subtle,#cfe2ff); }
.event-card.key-event { border-left:4px solid #ffc107; }

.event-card .ev-date { font-size:.85rem; color:var(--bs-secondary); font-weight:600; }
.event-card .ev-title { font-weight:600; }
.event-card .ev-desc { font-size:.9rem; color:var(--bs-secondary); }
.event-card .ev-legal { font-size:.85rem; color:var(--bs-info); font-style:italic; }
.event-card .ev-actions { opacity:0; transition:opacity .15s; }
.event-card:hover .ev-actions { opacity:1; }

[contenteditable]:focus { outline:2px solid var(--bs-primary); outline-offset:2px;
  border-radius:3px; background:var(--bs-body-bg); }
[contenteditable][data-placeholder]:empty::before { content:attr(data-placeholder);
  color:var(--bs-secondary); }

.export-dropdown .dropdown-item i { width:1.5rem; text-align:center; }

#toast-container { position:fixed; bottom:1rem; right:1rem; z-index:9999; }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid mt-4 px-4">
  <div class="row g-4">

    <!-- ── 좌측: 타임라인 목록 ── -->
    <div class="col-md-3">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h6 class="mb-0"><i class="fas fa-list me-2"></i>타임라인 목록</h6>
          <button class="btn btn-sm btn-primary" onclick="TL.createTimeline()">
            <i class="fas fa-plus"></i>
          </button>
        </div>
        <div class="card-body p-0" id="timeline-list">
          <div class="text-center text-muted py-4">불러오는 중…</div>
        </div>
      </div>
    </div>

    <!-- ── 우측: 타임라인 편집 ── -->
    <div class="col-md-9">
      <div id="editor-empty" class="text-center text-muted py-5">
        <i class="fas fa-arrow-left fa-2x mb-3 opacity-50"></i>
        <p>왼쪽에서 타임라인을 선택하거나 새로 만드세요.</p>
      </div>

      <div id="editor-panel" class="d-none">
        <!-- 헤더 -->
        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <div class="flex-grow-1">
                <h2 contenteditable="true" id="ed-title" class="mb-1"
                    data-placeholder="타임라인 제목"></h2>
                <p contenteditable="true" id="ed-desc" class="text-muted mb-2"
                   data-placeholder="설명을 입력하세요"></p>
                <div class="d-flex gap-3 text-muted small">
                  <span><i class="fas fa-calendar me-1"></i><span id="ed-range"></span></span>
                  <span><i class="fas fa-layer-group me-1"></i><span id="ed-count"></span>개 이벤트</span>
                  <span class="badge" id="ed-status"></span>
                </div>
              </div>
              <div class="tl-toolbar">
                <!-- 내보내기 드롭다운 -->
                <div class="dropdown export-dropdown">
                  <button class="btn btn-outline-success btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                    <i class="fas fa-download me-1"></i>내보내기
                  </button>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#" onclick="TL.exportAs('pptx')">
                      <i class="fas fa-file-powerpoint text-danger"></i> PowerPoint</a></li>
                    <li><a class="dropdown-item" href="#" onclick="TL.exportAs('docx')">
                      <i class="fas fa-file-word text-primary"></i> Word</a></li>
                    <li><a class="dropdown-item" href="#" onclick="TL.exportAs('html')">
                      <i class="fas fa-file-code text-success"></i> HTML</a></li>
                  </ul>
                </div>
                <button class="btn btn-outline-primary btn-sm" onclick="TL.saveMeta()">
                  <i class="fas fa-save me-1"></i>저장
                </button>
                <button class="btn btn-outline-danger btn-sm" onclick="TL.deleteTimeline()">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 이벤트 추가 버튼 -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mb-0"><i class="fas fa-stream me-2"></i>이벤트</h5>
          <button class="btn btn-sm btn-primary" onclick="TL.showAddEvent()">
            <i class="fas fa-plus me-1"></i>이벤트 추가
          </button>
        </div>

        <!-- 이벤트 목록 (드래그앤드롭) -->
        <div id="event-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── 이벤트 추가/수정 모달 ── -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eventModalTitle">이벤트 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="ev-edit-id">
        <div class="mb-3">
          <label class="form-label">제목 *</label>
          <input type="text" class="form-control" id="ev-form-title" required>
        </div>
        <div class="row mb-3">
          <div class="col-7">
            <label class="form-label">날짜/시간 *</label>
            <input type="datetime-local" class="form-control" id="ev-form-ts">
          </div>
          <div class="col-5">
            <label class="form-label">유형</label>
            <select class="form-select" id="ev-form-type">
              <option value="email">이메일</option>
              <option value="email_sent">발신</option>
              <option value="email_received">수신</option>
              <option value="email_replied">회신</option>
              <option value="additional_evidence">추가 증거</option>
              <option value="document">문서</option>
              <option value="evidence_created">증거 생성</option>
              <option value="attachment_added">첨부파일</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">설명</label>
          <textarea class="form-control" id="ev-form-desc" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">법적 중요성</label>
          <input type="text" class="form-control" id="ev-form-legal" placeholder="예: 갑 제3호증 관련">
        </div>
        <div class="mb-3">
          <label class="form-label">비고</label>
          <textarea class="form-control" id="ev-form-notes" rows="2"></textarea>
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="ev-form-key">
          <label class="form-check-label" for="ev-form-key">★ 핵심 이벤트</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary" onclick="TL.saveEvent()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- 토스트 -->
<div id="toast-container"></div>

{% endblock %}

{% block scripts %}
<!-- SortableJS CDN -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
const TL = (() => {
  let currentId = null;
  let sortable = null;
  const API = '/api/timelines';

  // ── 유틸 ──
  function toast(msg, type='success') {
    const el = document.createElement('div');
    el.className = `alert alert-${type} alert-dismissible fade show shadow-sm`;
    el.style.cssText = 'min-width:250px;';
    el.innerHTML = `${msg}<button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>`;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  async function api(path, opts={}) {
    const r = await fetch(path, {
      headers: {'Content-Type':'application/json', ...opts.headers},
      ...opts,
    });
    if (opts.method === 'GET' || !opts.method) {
      // export는 blob으로 처리
    }
    return r;
  }

  async function apiJson(path, opts={}) {
    const r = await api(path, opts);
    return r.json();
  }

  // ── 타임라인 목록 ──
  async function loadList() {
    const d = await apiJson(API);
    const el = document.getElementById('timeline-list');
    if (!d.timelines || d.timelines.length === 0) {
      el.innerHTML = '<div class="text-center text-muted py-4">타임라인이 없습니다</div>';
      return;
    }
    el.innerHTML = d.timelines.map(t => `
      <div class="tl-list-item p-3 border-bottom ${t.id === currentId ? 'active':''}"
           onclick="TL.loadTimeline(${t.id})">
        <div class="fw-semibold">${esc(t.title)}</div>
        <small class="text-muted">${t.event_count || 0}개 이벤트 · ${t.status || 'draft'}</small>
      </div>
    `).join('');
  }

  // ── 타임라인 로드 ──
  async function loadTimeline(id) {
    currentId = id;
    const d = await apiJson(`${API}/${id}`);
    if (!d.success) { toast(d.error, 'danger'); return; }
    const t = d.timeline;

    document.getElementById('editor-empty').classList.add('d-none');
    document.getElementById('editor-panel').classList.remove('d-none');

    document.getElementById('ed-title').textContent = t.title;
    document.getElementById('ed-desc').textContent = t.description || '';
    document.getElementById('ed-range').textContent =
      `${t.date_range_start || 'N/A'} ~ ${t.date_range_end || 'N/A'}`;
    document.getElementById('ed-count').textContent = t.event_count;

    const badge = document.getElementById('ed-status');
    badge.textContent = t.status;
    badge.className = `badge bg-${t.status === 'finalized' ? 'success' : 'warning'}`;

    renderEvents(t.events || []);
    loadList();
  }

  // ── 이벤트 렌더링 ──
  function renderEvents(events) {
    const el = document.getElementById('event-list');
    if (events.length === 0) {
      el.innerHTML = '<div class="text-center text-muted py-4">이벤트가 없습니다. 위 버튼으로 추가하세요.</div>';
      initSortable();
      return;
    }
    el.innerHTML = events.map(e => {
      const ts = (e.timestamp || '').substring(0, 10);
      const keyCls = e.is_key_event ? ' key-event' : '';
      const keyMark = e.is_key_event ? '★ ' : '';
      let extra = '';
      if (e.description) extra += `<div class="ev-desc mt-1">${esc(e.description).substring(0,150)}</div>`;
      if (e.legal_significance) extra += `<div class="ev-legal mt-1">⚖ ${esc(e.legal_significance)}</div>`;
      return `
        <div class="event-card${keyCls}" data-id="${e.id}">
          <div class="d-flex justify-content-between align-items-start">
            <div class="flex-grow-1">
              <div class="ev-date">${esc(ts)} <span class="badge bg-secondary bg-opacity-25 text-secondary ms-1" style="font-size:.7rem">${esc(e.event_type || 'email')}</span></div>
              <div class="ev-title">${keyMark}${esc(e.title)}</div>
              ${extra}
            </div>
            <div class="ev-actions d-flex gap-1">
              <button class="btn btn-sm btn-outline-primary" onclick="TL.editEvent(${e.id})" title="수정">
                <i class="fas fa-pen fa-xs"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" onclick="TL.deleteEvent(${e.id})" title="삭제">
                <i class="fas fa-times fa-xs"></i>
              </button>
            </div>
          </div>
        </div>`;
    }).join('');
    initSortable();
  }

  function initSortable() {
    const el = document.getElementById('event-list');
    if (sortable) sortable.destroy();
    sortable = Sortable.create(el, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      handle: '.event-card',
      onEnd: async () => {
        const ids = [...el.querySelectorAll('.event-card')].map(c => +c.dataset.id);
        const r = await apiJson(`${API}/${currentId}/events/reorder`, {
          method: 'PUT', body: JSON.stringify({event_ids: ids})
        });
        if (r.success) toast('순서 저장됨');
        else toast(r.error, 'danger');
      }
    });
  }

  // ── CRUD ──
  async function createTimeline() {
    const title = prompt('타임라인 이름:');
    if (!title) return;
    const r = await apiJson(API, {
      method: 'POST',
      body: JSON.stringify({title, description: ''})
    });
    if (r.success) {
      toast('타임라인 생성됨');
      await loadTimeline(r.timeline_id);
    } else toast(r.error, 'danger');
  }

  async function saveMeta() {
    const title = document.getElementById('ed-title').textContent.trim();
    const desc = document.getElementById('ed-desc').textContent.trim();
    if (!title) { toast('제목을 입력하세요', 'warning'); return; }
    const r = await apiJson(`${API}/${currentId}`, {
      method: 'PUT',
      body: JSON.stringify({title, description: desc})
    });
    if (r.success) { toast('저장됨'); loadList(); }
    else toast(r.error, 'danger');
  }

  async function deleteTimeline() {
    if (!confirm('이 타임라인을 삭제하시겠습니까?')) return;
    const r = await apiJson(`${API}/${currentId}`, {method: 'DELETE'});
    if (r.success) {
      toast('삭제됨');
      currentId = null;
      document.getElementById('editor-panel').classList.add('d-none');
      document.getElementById('editor-empty').classList.remove('d-none');
      loadList();
    } else toast(r.error, 'danger');
  }

  // ── 이벤트 ──
  function showAddEvent() {
    document.getElementById('eventModalTitle').textContent = '이벤트 추가';
    document.getElementById('ev-edit-id').value = '';
    document.getElementById('ev-form-title').value = '';
    document.getElementById('ev-form-ts').value = '';
    document.getElementById('ev-form-type').value = 'email';
    document.getElementById('ev-form-desc').value = '';
    document.getElementById('ev-form-legal').value = '';
    document.getElementById('ev-form-notes').value = '';
    document.getElementById('ev-form-key').checked = false;
    new bootstrap.Modal(document.getElementById('eventModal')).show();
  }

  async function editEvent(eid) {
    // 현재 타임라인에서 이벤트 찾기
    const d = await apiJson(`${API}/${currentId}`);
    const evt = (d.timeline.events || []).find(e => e.id === eid);
    if (!evt) return;

    document.getElementById('eventModalTitle').textContent = '이벤트 수정';
    document.getElementById('ev-edit-id').value = eid;
    document.getElementById('ev-form-title').value = evt.title || '';
    // datetime-local 포맷
    const ts = (evt.timestamp || '').replace(' ', 'T').substring(0, 16);
    document.getElementById('ev-form-ts').value = ts;
    document.getElementById('ev-form-type').value = evt.event_type || 'email';
    document.getElementById('ev-form-desc').value = evt.description || '';
    document.getElementById('ev-form-legal').value = evt.legal_significance || '';
    document.getElementById('ev-form-notes').value = evt.notes || '';
    document.getElementById('ev-form-key').checked = !!evt.is_key_event;
    new bootstrap.Modal(document.getElementById('eventModal')).show();
  }

  async function saveEvent() {
    const editId = document.getElementById('ev-edit-id').value;
    const payload = {
      title: document.getElementById('ev-form-title').value,
      timestamp: document.getElementById('ev-form-ts').value + ':00',
      event_type: document.getElementById('ev-form-type').value,
      description: document.getElementById('ev-form-desc').value,
      legal_significance: document.getElementById('ev-form-legal').value,
      notes: document.getElementById('ev-form-notes').value,
      is_key_event: document.getElementById('ev-form-key').checked,
    };
    if (!payload.title || !payload.timestamp) {
      toast('제목과 날짜는 필수입니다', 'warning'); return;
    }

    let r;
    if (editId) {
      r = await apiJson(`${API}/${currentId}/events/${editId}`, {
        method: 'PUT', body: JSON.stringify(payload)
      });
    } else {
      r = await apiJson(`${API}/${currentId}/events`, {
        method: 'POST', body: JSON.stringify(payload)
      });
    }

    if (r.success) {
      toast(editId ? '이벤트 수정됨' : '이벤트 추가됨');
      bootstrap.Modal.getInstance(document.getElementById('eventModal')).hide();
      loadTimeline(currentId);
    } else toast(r.error || r.message, 'danger');
  }

  async function deleteEvent(eid) {
    if (!confirm('이 이벤트를 삭제하시겠습니까?')) return;
    const r = await apiJson(`${API}/${currentId}/events/${eid}`, {method: 'DELETE'});
    if (r.success) { toast('이벤트 삭제됨'); loadTimeline(currentId); }
    else toast(r.error, 'danger');
  }

  // ── 내보내기 ──
  function exportAs(fmt) {
    if (!currentId) return;
    window.open(`${API}/${currentId}/export/${fmt}`, '_blank');
  }

  // ── HTML 이스케이프 ──
  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ── 초기화 ──
  document.addEventListener('DOMContentLoaded', loadList);

  return {
    loadList, loadTimeline, createTimeline, saveMeta, deleteTimeline,
    showAddEvent, editEvent, saveEvent, deleteEvent, exportAs,
  };
})();
</script>
{% endblock %}
