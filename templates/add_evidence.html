{% extends "base.html" %} {% block title %}추가 증거 등록 - 이메일 타임라인 시스템{% endblock %} {% block content %}
<div class="container mt-4">
  <div class="page-header mb-4">
    <div class="d-flex align-items-center justify-content-between">
      <div>
        <h1 class="h2 mb-2">
          <i class="fas fa-plus me-2"></i>추가 증거 등록
        </h1>
        <p class="text-muted mb-0">이메일 외 추가 증거 자료를 등록합니다.</p>
      </div>
      <div>
        <a href="/evidence" class="btn btn-outline-secondary">
          <i class="fas fa-angle-left me-2"></i>목록으로
        </a>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form id="addEvidenceForm" enctype="multipart/form-data" method="post" action="/api/add_evidence">
        <div class="mb-3">
          <label for="evidenceTitle" class="form-label">증거 제목 <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="evidenceTitle" name="title" required />
        </div>

        <div class="mb-3">
          <label for="evidenceType" class="form-label">증거 유형</label>
          <select class="form-select" id="evidenceType" name="type">
            <option value="문서">문서</option>
            <option value="이미지">이미지</option>
            <option value="동영상">동영상</option>
            <option value="음성">음성</option>
            <option value="기타">기타</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="evidenceDate" class="form-label">증거 일시</label>
          <input type="datetime-local" class="form-control" id="evidenceDate" name="timestamp" />
        </div>

        <div class="mb-3">
          <label for="evidenceDescription" class="form-label">설명</label>
          <textarea class="form-control" id="evidenceDescription" name="description" rows="3"></textarea>
        </div>

        <div class="mb-3">
          <label for="evidenceFile" class="form-label">파일 첨부</label>
          <input type="file" class="form-control" id="evidenceFile" name="file" />
          <div class="form-text">최대 100MB까지 업로드 가능합니다.</div>
        </div>

        <div class="d-flex justify-content-end">
          <a href="/evidence" class="btn btn-secondary me-2">취소</a>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>등록</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  // Progressive enhancement: submit via fetch for nicer UX
  document.getElementById('addEvidenceForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.currentTarget;
    const fd = new FormData(form);
    try {
      const res = await fetch(form.action, { method: 'POST', body: fd });
      const json = await res.json();
      if (json.success) {
        window.location.href = '/evidence';
      } else {
        alert('증거 등록 실패: ' + (json.error || '알 수 없는 오류'));
      }
    } catch (err) {
      alert('오류가 발생했습니다: ' + err.message);
    }
  });
</script>

{% endblock %}
