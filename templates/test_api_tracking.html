{% extends "base.html" %}

{% block title %}API 테스트 결과 저장 검증{% endblock %}

{% block content %}
<h1 class="mb-4">API 테스트 결과 저장 검증</h1>

<div class="mb-3">
  <button class="btn btn-primary" onclick="testSingleAPI()"><i class="fas fa-play"></i> 단일 테스트 실행</button>
  <button class="btn btn-outline-secondary" onclick="checkHistory()"><i class="fas fa-history"></i> 이력 페이지 열기</button>
</div>

<div id="results"></div>
{% endblock %}

{% block scripts %}
<script>
  function testSingleAPI() {
  const resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '<p>테스트 실행 중...</p>';

  const startTime = performance.now();

  fetch('/evidence')
    .then(async response => {
      const endTime = performance.now();
      const responseTime = Math.round(endTime - startTime);

      const testResult = {
        endpoint: '/evidence',
        method: 'GET',
        status_code: response.status,
        response_time_ms: responseTime,
        success: response.ok,
        error_message: response.ok ? null : `HTTP ${response.status}`,
        request_data: '{}',
        response_data: 'test from browser'
      };

      return fetch('/api/test-result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(testResult)
      }).then(saveResponse => {
        return { testResponse: response, saveResponse, responseTime };
      });
    })
    .then(async ({ testResponse, saveResponse, responseTime }) => {
      const saveData = await saveResponse.json();

      let html = '<div class="test-tracking-result success">';
      html += '<h3>✅ 테스트 성공</h3>';
      html += `<p>엔드포인트: /evidence</p>`;
      html += `<p>상태 코드: ${testResponse.status}</p>`;
      html += `<p>응답 시간: ${responseTime}ms</p>`;
      html += `<p>저장 결과: ${saveData.message} (ID: ${saveData.id})</p>`;
      html += '</div>';

      resultsDiv.innerHTML = html;
    })
    .catch(error => {
      resultsDiv.innerHTML = `<div class="test-tracking-result error">❌ 오류: ${error.message}</div>`;
    });
}

  function checkHistory() {
      window.open('/api/docs/history', '_blank');
    }
  </script>
{% endblock %}
