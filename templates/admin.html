{% extends "base.html" %} {% block content %}
<div class="container-fluid py-4">
  <!-- 헤더 -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>
      <i class="fas fa-cog text-primary"></i>
      시스템 관리
    </h2>
      <button type="button" class="btn btn-outline-warning btn-sm ms-2" onclick="cleanupTasks()">
        <i class="fas fa-trash-alt"></i> 비정상 작업 정리
      </button>
    </div>
  </div>

  <!-- 통계 카드 -->
  <div class="row mb-4" id="taskStats">
    <div class="col-md-3">
      <div class="card text-white bg-primary">
        <div class="card-body text-center">
          <h5 class="card-title">전체 작업</h5>
          <h2 id="totalTasks">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-warning">
        <div class="card-body text-center">
          <h5 class="card-title">진행 중</h5>
          <h2 id="activeTasks">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-success">
        <div class="card-body text-center">
          <h5 class="card-title">완료</h5>
          <h2 id="completedTasks">0</h2>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card text-white bg-danger">
        <div class="card-body text-center">
          <h5 class="card-title">오류</h5>
          <h2 id="errorTasks">0</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- 작업 목록 -->
  <div class="card mb-4">
    <div class="card-header bg-light">
      <h5 class="mb-0"><i class="fas fa-list"></i> 작업 목록</h5>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>작업 ID</th>
              <th>작업명</th>
              <th>상태</th>
              <th>진행률</th>
              <th>시작 시간</th>
              <th>마지막 업데이트</th>
              <th>작업</th>
            </tr>
          </thead>
          <tbody id="taskList">
            <!-- 작업 목록이 여기에 동적으로 추가됩니다 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 시스템 정보 -->
  <div class="card">
    <div class="card-header bg-light">
      <h5 class="mb-0"><i class="fas fa-info-circle"></i> 시스템 정보</h5>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between">
              <strong>서버 상태:</strong>
              <span class="badge bg-success">정상</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <strong>메모리 사용량:</strong>
              <span id="memoryUsage">-</span>
            </li>
          </ul>
        </div>
        <div class="col-md-6">
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between">
              <strong>업로드된 파일:</strong>
              <span id="uploadedFiles">-</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <strong>처리된 이메일:</strong>
              <span id="processedEmails">-</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  let refreshInterval;

  function loadTaskData() {
    fetch("/api/admin/tasks")
      .then((response) => response.json())
      .then((data) => {
        // 통계 업데이트
        document.getElementById("totalTasks").textContent = data.total_tasks;
        document.getElementById("activeTasks").textContent =
          data.active_tasks.length;

        let completed = 0,
          errors = 0;
        Object.values(data.tasks).forEach((task) => {
          if (task.status === "completed") completed++;
          if (task.status === "error") errors++;
        });

        document.getElementById("completedTasks").textContent = completed;
        document.getElementById("errorTasks").textContent = errors;

        // 작업 목록 업데이트
        const taskList = document.getElementById("taskList");
        taskList.innerHTML = "";

        Object.entries(data.tasks).forEach(([taskId, task]) => {
          const row = document.createElement("tr");
          const statusClass =
            task.status === "completed"
              ? "success"
              : task.status === "error"
              ? "danger"
              : task.status === "processing"
              ? "warning"
              : "secondary";

          // 작업명에서 파일명만 추출 (상태 정보 제거)
          let displayName = task.task_name;
          if (displayName && displayName.includes(" 파싱")) {
            // "파일명 파싱 중" -> "파일명 처리"로 변경
            displayName = displayName.replace(/ 파싱.*$/, " 처리");
          }

          row.innerHTML = `
            <td><code>${taskId.substring(0, 8)}...</code></td>
            <td>${displayName}</td>
            <td><span class="badge bg-${statusClass}">${task.status}</span></td>
            <td>
              <div class="progress h-20px">
                <div class="progress-bar" style="width: ${
                  task.progress
                }%">${Math.round(task.progress)}%</div>
              </div>
            </td>
            <td>${formatDateTimeFull(task.started_at)}</td>
            <td>${formatDateTimeFull(task.updated_at)}</td>
            <td>
              <button class="btn btn-sm btn-outline-danger" onclick="removeTask('${taskId}')">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          `;
          taskList.appendChild(row);
        });
      })
      .catch((error) => {
        console.error("작업 데이터 로드 실패:", error);
      });
  }

  function loadSystemInfo() {
    fetch("/api/admin/system-info")
      .then((response) => response.json())
      .then((data) => {
        document.getElementById("memoryUsage").textContent = data.memory_usage;
        document.getElementById("uploadedFiles").textContent =
          data.uploaded_files;
        document.getElementById("processedEmails").textContent =
          data.processed_emails;
      })
      .catch((error) => {
        console.error("시스템 정보 로드 실패:", error);
        document.getElementById("memoryUsage").textContent = "로드 실패";
        document.getElementById("uploadedFiles").textContent = "0";
        document.getElementById("processedEmails").textContent = "0";
      });
  }

  function cleanupTasks() {
    if (confirm("비정상 종료된 작업들을 정리하시겠습니까?")) {
      fetch("/api/admin/cleanup", { method: "POST" })
        .then((response) => response.json())
        .then((data) => {
          if (data.success) {
            alert(data.message);
            loadTaskData(); // 데이터 새로고침
          } else {
            alert("정리 실패: " + data.error);
          }
        })
        .catch((error) => {
          alert("정리 중 오류 발생: " + error);
        });
    }
  }

  function removeTask(taskId) {
    if (confirm("이 작업을 제거하시겠습니까?")) {
      fetch(`/api/admin/task/${taskId}`, {
        method: "DELETE",
        headers: {
          "Content-Type": "application/json",
        },
      })
        .then((response) => response.json())
        .then((data) => {
          if (data.status === "success") {
            alert(data.message);
            loadTaskData(); // 목록 새로고침
          } else {
            alert(`작업 제거 실패: ${data.error || "알 수 없는 오류"}`);
          }
        })
        .catch((error) => {
          console.error("작업 제거 오류:", error);
          alert(`작업 제거 오류: ${error.message}`);
        });
    }
  }

  // 페이지 로드 시 데이터 로드
  document.addEventListener("DOMContentLoaded", function () {
    loadTaskData();
    loadSystemInfo();

    // 10초마다 자동 새로고침
    refreshInterval = setInterval(() => {
      loadTaskData();
      loadSystemInfo();
    }, 10000);
  });

  // 페이지 떠날 때 interval 정리
  window.addEventListener("beforeunload", function () {
    if (refreshInterval) {
      clearInterval(refreshInterval);
    }
  });
</script>
{% endblock %}
