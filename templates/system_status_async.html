{% extends "base.html" %} {% block content %}

<div class="container-fluid mt-4">
  <!-- 헤더 -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h2>
            <i class="fas fa-server text-primary"></i>
            시스템 상태 모니터
          </h2>
          <p class="text-muted mb-0">
            <small>
              <i class="fas fa-clock"></i>
              <span id="timestamp">{{ status.timestamp }}</span>
              <span class="ms-2">|</span>
              <span class="ms-2">v{{ status.version }}</span>
              <span class="ms-2">|</span>
              <span class="ms-2 status-badge status-running" id="overall-status"
                >로딩중...</span
              >
            </small>
          </p>
        </div>
        <div>
          <button
            class="btn btn-outline-primary btn-sm"
            onclick="refreshStatus()"
          >
            <i class="fas fa-sync-alt"></i> 새로고침
          </button>
          <a href="/" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-home"></i> 홈
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 시스템 리소스 -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card metric-card">
        <div class="card-body">
          <h6 class="card-title text-muted mb-3">
            <i class="fas fa-microchip"></i> CPU 사용률
          </h6>
          <div id="cpu-metric" class="skeleton h-60px"></div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card metric-card">
        <div class="card-body">
          <h6 class="card-title text-muted mb-3">
            <i class="fas fa-memory"></i> 메모리 사용률
          </h6>
          <div id="memory-metric" class="skeleton h-60px"></div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card metric-card">
        <div class="card-body">
          <h6 class="card-title text-muted mb-3">
            <i class="fas fa-hdd"></i> 디스크 사용률
          </h6>
          <div id="disk-metric" class="skeleton h-60px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 서비스 상태 -->
  <div class="row mb-4">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-white">
          <h5 class="mb-0"><i class="fas fa-cogs"></i> 서비스 상태</h5>
        </div>
        <div class="card-body">
          <div id="services-list">
            <div class="skeleton mb-2 h-60px"></div>
            <div class="skeleton mb-2 h-60px"></div>
            <div class="skeleton mb-2 h-60px"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-white">
          <h5 class="mb-0"><i class="fas fa-chart-bar"></i> 통계</h5>
        </div>
        <div class="card-body">
          <div id="statistics-list">
            <div class="skeleton mb-2 h-40px"></div>
            <div class="skeleton mb-2 h-40px"></div>
            <div class="skeleton mb-2 h-40px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 최근 활동 -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-white">
          <h6 class="mb-0"><i class="fas fa-envelope"></i> 최근 처리 이메일</h6>
        </div>
        <div class="card-body">
          <div id="recent-emails">
            <div class="skeleton mb-2" style="height: 30px"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-white">
          <h6 class="mb-0"><i class="fas fa-upload"></i> 최근 업로드</h6>
        </div>
        <div class="card-body">
          <div id="recent-uploads">
            <div class="skeleton mb-2" style="height: 30px"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <div class="card-header bg-white">
          <h6 class="mb-0"><i class="fas fa-file-alt"></i> 최근 로그</h6>
        </div>
        <div class="card-body">
          <div id="recent-logs">
            <div class="skeleton mb-2" style="height: 30px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 프로세스 정보 -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-header bg-white">
          <h6 class="mb-0"><i class="fas fa-info-circle"></i> 프로세스 정보</h6>
        </div>
        <div class="card-body">
          <div id="process-info">
            <div class="skeleton h-40px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let refreshInterval = null;

  // 초기 로드
  document.addEventListener("DOMContentLoaded", function () {
    loadSystemStatus();

    // 30초마다 자동 새로고침
    refreshInterval = setInterval(loadSystemStatus, 30000);
  });

  // 수동 새로고침
  function refreshStatus() {
    loadSystemStatus();
  }

  // 시스템 상태 로드 (비동기)
  async function loadSystemStatus() {
    try {
      const response = await fetch("/api/system/status");
      if (!response.ok) throw new Error("Status API failed");

      const data = await response.json();
      updateUI(data);
    } catch (error) {
      console.error("Failed to load system status:", error);
      showError(error.message);
    }
  }

  // UI 업데이트
  function updateUI(data) {
    // 타임스탬프
    document.getElementById("timestamp").textContent = data.timestamp;

    // 전체 상태
    const statusBadge = document.getElementById("overall-status");
    statusBadge.textContent = data.status === "healthy" ? "정상" : "경고";
    statusBadge.className = `ms-2 status-badge status-${
      data.status === "healthy" ? "running" : "idle"
    }`;

    // CPU
    updateMetric(
      "cpu-metric",
      data.system.cpu.percent,
      data.system.cpu.count + " 코어"
    );

    // 메모리
    updateMetric(
      "memory-metric",
      data.system.memory.percent,
      `${data.system.memory.used_gb}GB / ${data.system.memory.total_gb}GB`
    );

    // 디스크
    updateMetric(
      "disk-metric",
      data.system.disk.percent,
      `${data.system.disk.used_gb}GB / ${data.system.disk.total_gb}GB`
    );

    // 서비스 목록
    updateServices(data.services);

    // 통계
    updateStatistics(data.statistics);

    // 최근 활동
    updateRecentActivity(data.recent_activity);

    // 프로세스 정보
    updateProcessInfo(data.process);
  }

  function updateMetric(id, percent, detail) {
    const elem = document.getElementById(id);
    const color =
      percent < 70 ? "success" : percent < 90 ? "warning" : "danger";

    elem.innerHTML = `
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h2 class="mb-0 text-${color}">${percent.toFixed(1)}%</h2>
        <small class="text-muted">${detail}</small>
      </div>
      <div class="progress" style="width: 60px; height: 60px; border-radius: 50%; position: relative;">
        <svg width="60" height="60">
          <circle cx="30" cy="30" r="25" fill="none" stroke="#e9ecef" stroke-width="5"/>
          <circle class="progress-ring" cx="30" cy="30" r="25" fill="none"
                  stroke="var(--bs-${color})" stroke-width="5"
                  stroke-dasharray="${(157 * percent) / 100} 157"/>
        </svg>
      </div>
    </div>
  `;
  }

  function updateServices(services) {
    const container = document.getElementById("services-list");
    container.innerHTML = services
      .map(
        (s) => `
    <div class="service-item ${
      s.healthy ? "healthy" : ""
    } p-3 mb-2 border rounded">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <strong>${s.name}</strong>
          <div class="text-muted small">${s.info || ""}</div>
        </div>
        <span class="status-badge status-${s.status}">${s.status}</span>
      </div>
    </div>
  `
      )
      .join("");
  }

  function updateStatistics(stats) {
    const container = document.getElementById("statistics-list");
    container.innerHTML = `
    <div class="d-flex justify-content-between py-2 border-bottom">
      <span><i class="fas fa-envelope text-primary"></i> 처리된 이메일</span>
      <strong>${stats.processed_emails}개</strong>
    </div>
    <div class="d-flex justify-content-between py-2 border-bottom">
      <span><i class="fas fa-file text-info"></i> 업로드 파일</span>
      <strong>${stats.upload_files}개</strong>
    </div>
    <div class="d-flex justify-content-between py-2 border-bottom">
      <span><i class="fas fa-file-alt text-secondary"></i> 로그 크기</span>
      <strong>${stats.log_size_mb} MB</strong>
    </div>
    <div class="d-flex justify-content-between py-2">
      <span><i class="fas fa-route text-success"></i> 등록된 라우트</span>
      <strong>${stats.registered_routes}개</strong>
    </div>
  `;
  }

  function updateRecentActivity(activity) {
    // 이메일
    const emailsElem = document.getElementById("recent-emails");
    if (activity.emails && activity.emails.length > 0) {
      emailsElem.innerHTML = activity.emails
        .map(
          (e) => `<div class="recent-activity-item"><small>${e}</small></div>`
        )
        .join("");
    } else {
      emailsElem.innerHTML = '<div class="text-muted small">활동 없음</div>';
    }

    // 업로드
    const uploadsElem = document.getElementById("recent-uploads");
    if (activity.uploads && activity.uploads.length > 0) {
      uploadsElem.innerHTML = activity.uploads
        .map(
          (u) =>
            `<div class="recent-activity-item">
        <small><strong>${u.name}</strong><br>${u.size} - ${u.time}</small>
      </div>`
        )
        .join("");
    } else {
      uploadsElem.innerHTML = '<div class="text-muted small">활동 없음</div>';
    }

    // 로그
    const logsElem = document.getElementById("recent-logs");
    if (activity.logs && activity.logs.length > 0) {
      logsElem.innerHTML = activity.logs
        .map(
          (l) => `<div class="recent-activity-item"><small>${l}</small></div>`
        )
        .join("");
    } else {
      logsElem.innerHTML = '<div class="text-muted small">로그 없음</div>';
    }
  }

  function updateProcessInfo(process) {
    const elem = document.getElementById("process-info");
    elem.innerHTML = `
    <div class="row text-center">
      <div class="col-md-3">
        <strong>PID</strong>
        <div class="text-primary">${process.pid}</div>
      </div>
      <div class="col-md-3">
        <strong>메모리</strong>
        <div class="text-info">${process.memory_mb} MB</div>
      </div>
      <div class="col-md-3">
        <strong>스레드</strong>
        <div class="text-success">${process.threads}개</div>
      </div>
      <div class="col-md-3">
        <strong>CPU</strong>
        <div class="text-warning">${process.cpu_percent}%</div>
      </div>
    </div>
  `;
  }

  function showError(message) {
    document.getElementById("overall-status").textContent = "오류";
    document.getElementById("overall-status").className =
      "ms-2 status-badge status-offline";
    console.error("System status error:", message);
  }

  // 페이지 종료 시 인터벌 클리어
  window.addEventListener("beforeunload", function () {
    if (refreshInterval) {
      clearInterval(refreshInterval);
    }
  });
</script>
{% endblock %}
