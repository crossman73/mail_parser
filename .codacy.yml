exclude_paths:
  - ".venv/**"
  - ".venv-wsl/**"
  - "scripts/vscode_diagnostics_**/**"
  - ".serena/**"
  - "tools/**"
  - "mcp/**"
  - "logs/**"
  - "archives/**"# Codacy configuration: exclude noisy or local-only paths from analysis
# This file lists patterns to skip during local Codacy CLI analysis.
exclude_patterns:
  - scripts/vscode_diagnostics_*/**
  - .serena/**
  - archives/**
  - workspace_backups/**
  - processed_emails/**
  - temp/**
  - logs/**
  - codacy_*.log
  - '*.log'
  - .venv/**

# Codacy Trivy configuration: enable and add common lockfile/Dockerfile patterns
# Adjust patterns to match your repo's package manager lockfiles if needed.
tools:
  trivy:
    enabled: true
    patterns:
      - "requirements.txt"
      - "**/requirements.txt"
      - "Pipfile.lock"
      - "poetry.lock"
      - "package-lock.json"
      - "yarn.lock"
      - "**/package-lock.json"
      - "**/yarn.lock"
      - "Dockerfile"
      - "**/Dockerfile"
  eslint-8:
    enabled: false
